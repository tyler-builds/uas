name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Releases build with no_gpl (see packaging/linux/build-release.sh), so test that build.
      - run: go vet -tags no_gpl ./...
      - run: go test -tags no_gpl ./...
      # A release program installs itself into a clean home, refreshes an old install, and uninstalls.
      - name: Packaging
        run: |
          packaging/linux/build-release.sh 0.0.1 x86_64 "$RUNNER_TEMP/dist"
          packaging/linux/test-install.sh "$RUNNER_TEMP/dist/uas-0.0.1-linux-x86_64"
