name: Release

# Builds uas for x86_64 and aarch64 and publishes a GitHub release with uas-linux-x86_64, uas-linux-aarch64,
# a signed uas-release.json that installed copies of uas check before updating themselves, and SHA256SUMS.
# Push a tag such as v0.6.0 to release; run it by hand to build without publishing (or with publish checked,
# to tag the commit it ran on and publish the given version).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 0.2.0"
        required: true
      publish:
        description: "Publish it (otherwise only build it)"
        type: boolean
        default: false

permissions:
  contents: write # the GitHub release for a tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        run: |
          v="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Releases build with no_gpl (see packaging/linux/build-release.sh).
      - run: go vet -tags no_gpl ./...
      - run: go test -tags no_gpl ./...
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) # reproducible file times
          for arch in x86_64 aarch64; do
            packaging/linux/build-release.sh "${{ steps.version.outputs.version }}" "$arch" dist
          done
      # The x86_64 program installs itself into a clean home, refreshes an old install, and uninstalls.
      - run: packaging/linux/test-install.sh dist/uas-${{ steps.version.outputs.version }}-linux-x86_64
      # The release's files: the programs under their release names, signed uas-release.json and SHA256SUMS.
      - name: Sign
        run: |
          go run ./cmd/uas-release -version "${{ steps.version.outputs.version }}" -out dist/github dist/uas-*-linux-*
          cat dist/github/SHA256SUMS
        env:
          UAS_SIGNING_KEY: ${{ secrets.UAS_SIGNING_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: uas-${{ steps.version.outputs.version }}
          path: dist/github/*
      - name: GitHub release
        if: github.event_name == 'push' || inputs.publish
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # Installed copies follow GitHub's latest release, so don't let an older version take its place.
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n1)
          if [ -n "$latest" ] && { [ "$latest" = "$tag" ] || [ "$newest" != "$tag" ]; }; then
            echo "$latest is released already; $tag is not newer"; exit 1
          fi
          gh release create "$tag" dist/github/* --target "$GITHUB_SHA" --title "uas ${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
