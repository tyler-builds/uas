# uas catalog Worker. Deploy from this directory with: npx wrangler deploy
# Set the upload token with: npx wrangler secret put UPLOAD_TOKEN
name = "uas-catalog"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "uas-catalog"
